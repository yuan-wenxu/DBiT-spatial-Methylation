[workspace]
authors = ["wenxu yuan <yuanwenxu123@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "DBiT-spatial-Methylation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
init = { cmd = "bash install-cli.sh", description = "Install the locked environment and the dbitm command" }

[dependencies]
python = "3.11.*"
setuptools = ">=80,<82"
bwa = ">=0.7.19,<0.8"
sinto = ">=0.9.0,<0.10"
samtools = ">=1.24,<2"
biscuit = ">=1.9.0.20260624,<2"
pysam = ">=0.24.0,<0.25"
pigz = ">=2.8,<3"
fuzzysearch = ">=0.8.1,<0.9"
fastp = ">=1.3.6,<2"
matplotlib-base = ">=3.11.0,<4"
numpy = ">=1.25.2,<2"
pandas = ">=1.2.3,<2"
llvmlite = "*"
statsmodels = ">=0.14.6,<0.15"

[pypi-dependencies]
methscan = { git = "https://github.com/yuan-wenxu/MethSCAn.git", tag = "v2.0.0" }
